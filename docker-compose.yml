services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: biomarkers
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      APP_STORE: postgres
      APP_DATABASE_URL: postgresql://app:app@db:5432/biomarkers
      APP_SEED_DEMO: "true"
      APP_DEMO_CSV: /app/demo_labs.csv
    volumes:
      - ./crates/api/tests/fixtures/demo_labs.csv:/app/demo_labs.csv:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
