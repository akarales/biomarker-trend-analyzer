services:
  # Local demo credentials only; bound to localhost. 5435 because 5433/5434
  # belong to other projects on the dev machine.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: biomarkers
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d biomarkers"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      APP_STORE: postgres
      APP_DATABASE_URL: postgresql://app:app@db:5432/biomarkers
      APP_SEED_DEMO: "true"
      APP_DEMO_CSV: /app/demo_labs.csv
    volumes:
      - ./crates/api/tests/fixtures/demo_labs.csv:/app/demo_labs.csv:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
