[workspace]
resolver = "3"
members = ["crates/drift", "crates/ingest", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
polars = { version = "=0.55.2", default-features = false, features = ["csv", "lazy", "strings", "temporal"] }
chrono = { version = "=0.4.45", features = ["serde"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros"] }
