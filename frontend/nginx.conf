server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # streamed explanations: never buffer, allow long model calls (API caps at 180 s)
    location = /api/v1/explain/stream {
        proxy_pass http://api:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 200s;
    }

    location /api/ {
        proxy_pass http://api:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
